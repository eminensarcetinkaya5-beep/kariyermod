<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KariyerMod - Football RPG</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --accent-coin: #f59e0b;
            --accent-gem: #38bdf8;
            --mega: #a855f7;
            --bg-dark: #070a12;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border: #1e293b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 420px; background: var(--bg-card); height: 100vh; max-height: 850px; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.8); overflow: hidden; }
        @media(min-width: 421px) { .app-container { height: 820px; border-radius: 24px; border: 1px solid var(--border); } }

        .header { padding: 18px; background: #0b1120; border-bottom: 1px solid var(--border); text-align: center; }
        .header h1 { font-size: 22px; font-weight: 900; color: var(--primary); letter-spacing: 1px; text-transform: uppercase; }

        .content-area { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; }
        .screen { display: none; flex-direction: column; gap: 12px; }
        .screen.active { display: flex; }

        .card { background: #070a12; border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
        
        /* Sekme Tuşları */
        .auth-nav { display: flex; background: #1e293b; padding: 4px; border-radius: 12px; margin-bottom: 14px; }
        .auth-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .auth-btn.active { background: var(--primary); color: white; }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-group label { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; background: #0b1120; border: 1px solid var(--border); border-radius: 10px; color: white; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary); }

        .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-sec { background: #1e293b; color: white; border: 1px solid var(--border); }
        .btn-danger { background: var(--danger); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-box { background: #0b1120; border: 1px solid var(--border); padding: 10px; border-radius: 10px; text-align: center; }
        .stat-box p { font-size: 10px; color: var(--text-muted); font-weight: 700; }
        .stat-box h3 { font-size: 15px; color: var(--primary); margin-top: 2px; }

        .navbar { display: none; background: #0b1120; border-top: 1px solid var(--border); padding: 8px; justify-content: space-around; }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; font-weight: 700; padding: 6px 12px; border-radius: 8px; }
        .nav-btn.active { color: var(--primary); background: rgba(16, 185, 129, 0.1); }

        .badge { background: var(--accent-coin); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; }
        .badge-gem { background: var(--accent-gem); }
        .badge-mega { background: var(--mega); color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>KariyerMod</h1>
    </div>

    <div class="content-area">
        <!-- GİRİŞ & KAYIT -->
        <div id="screen-auth" class="screen active">
            <div class="card">
                <div class="auth-nav">
                    <button class="auth-btn active" id="tab-login-btn" onclick="showForm('login')">Giriş Yap</button>
                    <button class="auth-btn" id="tab-reg-btn" onclick="showForm('register')">Kayıt Ol</button>
                </div>

                <div id="form-login">
                    <div class="form-group">
                        <label>Kullanıcı Adı</label>
                        <input type="text" id="loginUser" placeholder="Adınızı yazın">
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="loginPass" placeholder="••••••••">
                    </div>
                    <button class="btn" onclick="doLogin()">Giriş Yap ➔</button>
                </div>

                <div id="form-register" style="display: none;">
                    <div class="form-group">
                        <label>Yeni Kullanıcı Adı</label>
                        <input type="text" id="regUser" placeholder="Kullanıcı adı belirleyin">
                    </div>
                    <div class="form-group">
                        <label>Şifre</label>
                        <input type="password" id="regPass" placeholder="••••••••">
                    </div>
                    <button class="btn" onclick="doRegister()">Kayıt Ol ve Başla ✨</button>
                </div>
            </div>
        </div>

        <!-- KARİYER OLUŞTURMA -->
        <div id="screen-create" class="screen">
            <div class="card">
                <h2 style="font-size:16px; text-align:center; margin-bottom:12px;">⚽ Oyuncunu Oluştur</h2>
                <div class="form-group">
                    <label>Oyuncu Adı</label>
                    <input type="text" id="pName" placeholder="Örn: Arda Güler">
                </div>
                <div class="form-group">
                    <label>Mevki</label>
                    <select id="pPos">
                        <option value="ST">Forvet (ST)</option>
                        <option value="CAM">Oyun Kurucu (CAM)</option>
                        <option value="CM">Orta Saha (CM)</option>
                        <option value="CB">Stoper (CB)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Başlangıç Kulübü</label>
                    <select id="pTeam">
                        <option value="Altınordu FK">Altınordu FK (🪙 5.000 / 💎 50)</option>
                        <option value="Pendikspor">Pendikspor (🪙 8.500 / 💎 75)</option>
                        <option value="Feyenoord">Feyenoord (🪙 15.000 / 💎 120)</option>
                    </select>
                </div>
                <button class="btn" onclick="createCareer()">Kariyeri Başlat 🚀</button>
            </div>
        </div>

        <!-- ANA MERKEZ -->
        <div id="screen-hub" class="screen">
            <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h3 id="hName" style="font-size:16px;">-</h3>
                    <p id="hTeam" style="font-size:11px; color:var(--text-muted);">-</p>
                </div>
                <div style="text-align:right;">
                    <span class="badge" style="background:var(--primary); color:white;" id="hLvl">Lvl 1</span>
                    <h2 id="hOvr" style="color:var(--primary); font-size:18px;">68</h2>
                </div>
            </div>

            <div class="grid-2">
                <div class="stat-box" style="border-color:var(--accent-coin);"><p>🪙 Coin</p><h3 id="hCoins" style="color:var(--accent-coin);">0</h3></div>
                <div class="stat-box" style="border-color:var(--accent-gem);"><p>💎 Elmas</p><h3 id="hGems" style="color:var(--accent-gem);">0</h3></div>
            </div>

            <div class="grid-2">
                <div class="stat-box"><p>Enerji</p><h3 id="hEnergy">100</h3></div>
                <div class="stat-box"><p>Moral</p><h3 id="hMorale">95</h3></div>
            </div>

            <button class="btn" onclick="playMatch()">⚽ MAÇA ÇIK (+Coin & XP)</button>
            <button class="btn btn-sec" onclick="train()">💪 Antrenman Yap (+XP)</button>
        </div>

        <!-- TRANSFER PAZARI -->
        <div id="screen-market" class="screen">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:14px;">🛍️ Transfer Pazarı</h3>
                <button class="btn btn-sec" style="width:auto; padding:6px 12px; font-size:11px;" onclick="loadMarket()">🔄 Yenile</button>
            </div>
            <div id="marketList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <!-- ÖZELLİKLER -->
        <div id="screen-features" class="screen">
            <h3 style="font-size:14px;">⚡ 7.123 Özellik Kataloğu</h3>
            <input type="text" id="fSearch" placeholder="Özellik veya Mega Özellik ara..." oninput="renderFeatures()">
            <div class="card" id="fList" style="max-height:400px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;"></div>
        </div>

        <!-- PROFİL -->
        <div id="screen-profile" class="screen">
            <div class="card">
                <h3 style="font-size:14px; margin-bottom:8px;">👤 İstatistikler</h3>
                <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
                    <div style="display:flex; justify-content:space-between;"><span>Hız:</span><strong id="stSpd">68</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>Şut:</span><strong id="stSht">68</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>Pas:</span><strong id="stPas">68</strong></div>
                    <div style="display:flex; justify-content:space-between;"><span>Defans:</span><strong id="stDef">60</strong></div>
                </div>
            </div>
            <button class="btn btn-danger" onclick="logout()">Hesabı Sıfırla / Çıkış</button>
        </div>
    </div>

    <div class="navbar" id="mainNav">
        <button class="nav-btn active" onclick="nav('screen-hub', this)">🏠 Merkez</button>
        <button class="nav-btn" onclick="nav('screen-market', this)">🛍️ Transfer</button>
        <button class="nav-btn" onclick="nav('screen-features', this)">⚡ Özellikler</button>
        <button class="nav-btn" onclick="nav('screen-profile', this)">👤 Profil</button>
    </div>
</div>

<script>
    let user = JSON.parse(localStorage.getItem('km_usr')) || null;
    let game = JSON.parse(localStorage.getItem('km_gam')) || null;

    // 7123 Özellik Oluşturma
    const features = [];
    const baseNames = ["Trivela", "Ölü Yaprak", "Lazer Pas", "Çelik Bilek", "Meteor Şut", "Kuantum Çalım", "Titanyum Pres"];
    for(let i=1; i<=7123; i++) {
        let isM = i > 6848;
        let bName = baseNames[i % baseNames.length];
        features.push({
            id: i,
            name: isM ? `🔥 MEGA-${i-6848}: ${bName}` : `${bName} Lvl ${Math.ceil(i/7)}`,
            costC: isM ? (i-6848)*500 : i*80,
            costG: isM ? Math.ceil((i-6848)/10) : Math.ceil(i/200),
            isM: isM
        });
    }

    function showForm(m) {
        document.getElementById('tab-login-btn').classList.toggle('active', m==='login');
        document.getElementById('tab-reg-btn').classList.toggle('active', m==='register');
        document.getElementById('form-login').style.display = m==='login'?'block':'none';
        document.getElementById('form-register').style.display = m==='register'?'block':'none';
    }

    function doRegister() {
        const u = document.getElementById('regUser').value.trim();
        const p = document.getElementById('regPass').value.trim();
        if(!u || !p) return alert('Lütfen tüm alanları doldurun!');
        localStorage.setItem('km_usr', JSON.stringify({u, p}));
        alert('Kayıt başarılı! Giriş Yap sekmesinden giriş yapabilirsiniz.');
        showForm('login');
    }

    function doLogin() {
        const u = document.getElementById('loginUser').value.trim();
        const p = document.getElementById('loginPass').value.trim();
        user = JSON.parse(localStorage.getItem('km_usr'));
        if(!user || user.u !== u || user.p !== p) {
            return alert('Hatalı kullanıcı adı veya şifre! (Önce Kayıt Olun)');
        }
        if(!game) setScreen('screen-create');
        else { loadHub(); setScreen('screen-hub'); }
    }

    function createCareer() {
        const name = document.getElementById('pName').value.trim();
        const pos = document.getElementById('pPos').value;
        const team = document.getElementById('pTeam').value;
        if(!name) return alert('Lütfen futbolcu adı yazın!');

        let c = 5000, g = 50;
        if(team === 'Pendikspor') { c = 8500; g = 75; }
        if(team === 'Feyenoord') { c = 15000; g = 120; }

        game = { name, pos, team, lvl: 1, xp: 0, coins: c, gems: g, energy: 100, morale: 95, stats: { spd: 68, sht: 68, pas: 68, def: 60 } };
        localStorage.setItem('km_gam', JSON.stringify(game));
        loadHub();
        setScreen('screen-hub');
    }

    function loadHub() {
        if(!game) return;
        document.getElementById('hName').innerText = game.name;
        document.getElementById('hTeam').innerText = `${game.team} (${game.pos})`;
        document.getElementById('hLvl').innerText = `Lvl ${game.lvl}`;
        document.getElementById('hCoins').innerText = game.coins.toLocaleString();
        document.getElementById('hGems').innerText = game.gems;
        document.getElementById('hEnergy').innerText = game.energy;
        document.getElementById('hMorale').innerText = game.morale;
        document.getElementById('hOvr').innerText = Math.floor((game.stats.spd + game.stats.sht + game.stats.pas + game.stats.def)/4);
    }

    function setScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('mainNav').style.display = ['screen-auth', 'screen-create'].includes(id) ? 'none' : 'flex';
    }

    function nav(id, btn) {
        setScreen(id);
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if(id === 'screen-features') renderFeatures();
        if(id === 'screen-market') loadMarket();
        if(id === 'screen-profile') updateProfile();
    }

    function train() {
        if(game.energy < 15) return alert('Enerjiniz yetersiz!');
        game.energy -= 15; game.xp += 40; game.coins += 250; game.stats.spd += 1;
        if(game.xp >= game.lvl * 100) { game.lvl++; game.gems += 15; alert(`Level Atladın! Lvl ${game.lvl} (+15 Elmas)`); }
        localStorage.setItem('km_gam', JSON.stringify(game));
        loadHub();
    }

    function playMatch() {
        if(game.energy < 20) return alert('Enerjin yetersiz!');
        let win = Math.random() > 0.4;
        let cGain = win ? 1500 : 500;
        game.coins += cGain;
        game.energy -= 20;
        alert(win ? `🎉 Maçı Kazandın! +🪙 ${cGain} Coin` : `Maç Bitti. +🪙 ${cGain} Coin`);
        localStorage.setItem('km_gam', JSON.stringify(game));
        loadHub();
    }

    function loadMarket() {
        const names = ["Gabriel Rossi", "Bruno Silva", "Enzo Gomez", "Luka Modric"];
        const list = document.getElementById('marketList');
        list.innerHTML = '';
        names.forEach(n => {
            let prc = Math.floor(Math.random()*2000) + 3000;
            list.innerHTML += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div><h4 style="font-size:12px;">${n}</h4><p style="font-size:10px; color:var(--text-muted);">Transfer Adayı</p></div>
                    <button class="btn" style="width:auto; padding:6px 10px; font-size:11px;" onclick="buyP('${n}', ${prc})">🪙 ${prc}</button>
                </div>`;
        });
    }

    function buyP(n, p) {
        if(game.coins < p) return alert('Yetersiz Coin!');
        game.coins -= p; game.morale = Math.min(100, game.morale + 5);
        alert(`${n} transfer edildi!`);
        localStorage.setItem('km_gam', JSON.stringify(game));
        loadHub();
    }

    function renderFeatures() {
        const q = document.getElementById('fSearch').value.toLowerCase();
        const list = document.getElementById('fList');
        list.innerHTML = '';
        features.filter(f => f.name.toLowerCase().includes(q)).slice(0, 30).forEach(f => {
            list.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#0b1120; padding:8px; border-radius:8px;">
                    <span style="font-size:11px; color:${f.isM?'var(--mega)':'white'}">${f.name}</span>
                    <span class="badge ${f.isM?'badge-mega':''}">🪙${f.costC} / 💎${f.costG}</span>
                </div>`;
        });
    }

    function updateProfile() {
        if(!game) return;
        document.getElementById('stSpd').innerText = game.stats.spd;
        document.getElementById('stSht').innerText = game.stats.sht;
        document.getElementById('stPas').innerText = game.stats.pas;
        document.getElementById('stDef').innerText = game.stats.def;
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
